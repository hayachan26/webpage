<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ポップタイピング</title>
    <style>
      :root {
        --bg: #f8fbff;
        --ink: #1f2937;
        --muted: #64748b;
        --panel: #ffffff;
        --line: #dbe5f0;
        --blue: #2563eb;
        --pink: #e11d48;
        --green: #16a34a;
        --yellow: #f59e0b;
        --shadow: 0 18px 50px rgba(30, 41, 59, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(37, 99, 235, 0.14), transparent 28%),
          radial-gradient(circle at 82% 24%, rgba(225, 29, 72, 0.12), transparent 24%),
          var(--bg);
      }

      button,
      input {
        font: inherit;
      }

      main {
        width: min(1060px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0;
      }

      .game {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(78px, 1fr));
        gap: 10px;
      }

      .stat {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
      }

      .stat strong {
        display: block;
        margin-top: 3px;
        font-size: 1.35rem;
        line-height: 1;
      }

      .stage {
        position: relative;
        min-height: 420px;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.38)),
          linear-gradient(135deg, #dff3ff, #fff4dc 54%, #ffe8f0);
      }

      .bubble {
        position: absolute;
        width: min(520px, calc(100% - 48px));
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 24px;
        text-align: center;
        background: rgba(255, 255, 255, 0.94);
        border: 3px solid var(--blue);
        border-radius: 8px;
        box-shadow: 0 16px 32px rgba(37, 99, 235, 0.16);
        transition: transform 0.16s ease, border-color 0.16s ease;
      }

      .bubble.pop {
        transform: translate(-50%, -50%) scale(1.08);
        border-color: var(--pink);
      }

      .kana {
        margin: 0 0 8px;
        color: var(--muted);
        font-weight: 800;
      }

      .word {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4.8rem);
        font-weight: 900;
        line-height: 1.05;
      }

      .roman {
        min-height: 48px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(1.35rem, 5vw, 2.7rem);
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .typed {
        color: var(--green);
      }

      .left {
        color: var(--pink);
      }

      .targets {
        position: absolute;
        inset: 18px;
        pointer-events: none;
      }

      .dot {
        position: absolute;
        width: 42px;
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0.32;
        background: var(--yellow);
      }

      .dot:nth-child(1) {
        left: 8%;
        top: 18%;
      }

      .dot:nth-child(2) {
        right: 12%;
        top: 26%;
        background: var(--pink);
      }

      .dot:nth-child(3) {
        left: 18%;
        bottom: 16%;
        background: var(--blue);
      }

      .dot:nth-child(4) {
        right: 22%;
        bottom: 18%;
        background: var(--green);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        padding: 22px;
        border-top: 1px solid var(--line);
      }

      input {
        width: 100%;
        min-height: 58px;
        padding: 0 16px;
        border: 2px solid var(--line);
        border-radius: 8px;
        font-size: 1.35rem;
        outline: none;
      }

      input:focus {
        border-color: var(--blue);
      }

      button {
        min-height: 58px;
        padding: 0 24px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: var(--blue);
        font-weight: 900;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .message {
        min-height: 28px;
        padding: 0 22px 22px;
        color: var(--muted);
        font-weight: 800;
      }

      .result {
        display: none;
        margin: 0 22px 22px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .result.show {
        display: block;
      }

      .result h2 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .result p {
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .header,
        .controls {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stage {
          min-height: 390px;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="game">
        <div class="header">
          <h1>ポップタイピング</h1>
          <div class="stats" aria-live="polite">
            <div class="stat">
              <span>TIME</span>
              <strong id="time">45</strong>
            </div>
            <div class="stat">
              <span>SCORE</span>
              <strong id="score">0</strong>
            </div>
            <div class="stat">
              <span>POP</span>
              <strong id="cleared">0</strong>
            </div>
            <div class="stat">
              <span>MISS</span>
              <strong id="miss">0</strong>
            </div>
          </div>
        </div>

        <section class="stage" aria-label="タイピングゲーム">
          <div class="targets" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="bubble" id="bubble">
            <p class="kana" id="kana">スタートを押して開始</p>
            <p class="word" id="word">POP</p>
            <div class="roman" id="roman">
              <span class="typed"></span><span class="left">typing</span>
            </div>
          </div>
        </section>

        <div class="controls">
          <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
          <button id="start">スタート</button>
        </div>
        <div class="message" id="message">表示されたローマ字を最後まで打つとポップします。</div>
        <div class="result" id="result" aria-live="polite"></div>
      </div>
    </main>

    <script>
      const words = [
        { kana: "りんご", word: "APPLE", roman: "apple" },
        { kana: "バナナ", word: "BANANA", roman: "banana" },
        { kana: "さくら", word: "SAKURA", roman: "sakura" },
        { kana: "ひこうき", word: "PLANE", roman: "plane" },
        { kana: "えんぴつ", word: "PENCIL", roman: "pencil" },
        { kana: "ゲーム", word: "GAME", roman: "game" },
        { kana: "タイピング", word: "TYPING", roman: "typing" },
        { kana: "ミュージック", word: "MUSIC", roman: "music" },
        { kana: "チャレンジ", word: "CHALLENGE", roman: "challenge" },
        { kana: "スピード", word: "SPEED", roman: "speed" },
        { kana: "フラワー", word: "FLOWER", roman: "flower" },
        { kana: "スマイル", word: "SMILE", roman: "smile" },
        { kana: "スター", word: "STAR", roman: "star" },
        { kana: "ドリーム", word: "DREAM", roman: "dream" }
      ];

      const timeEl = document.querySelector("#time");
      const scoreEl = document.querySelector("#score");
      const clearedEl = document.querySelector("#cleared");
      const missEl = document.querySelector("#miss");
      const kanaEl = document.querySelector("#kana");
      const wordEl = document.querySelector("#word");
      const romanEl = document.querySelector("#roman");
      const inputEl = document.querySelector("#input");
      const startEl = document.querySelector("#start");
      const messageEl = document.querySelector("#message");
      const resultEl = document.querySelector("#result");
      const bubbleEl = document.querySelector("#bubble");

      let current = words[0];
      let typed = "";
      let timeLeft = 45;
      let score = 0;
      let cleared = 0;
      let miss = 0;
      let keyCount = 0;
      let timerId = null;
      let playing = false;

      function chooseWord() {
        const next = words[Math.floor(Math.random() * words.length)];
        if (next === current && words.length > 1) {
          return chooseWord();
        }
        return next;
      }

      function renderStats() {
        timeEl.textContent = timeLeft;
        scoreEl.textContent = score;
        clearedEl.textContent = cleared;
        missEl.textContent = miss;
      }

      function renderWord() {
        kanaEl.textContent = current.kana;
        wordEl.textContent = current.word;
        romanEl.innerHTML = `<span class="typed">${typed}</span><span class="left">${current.roman.slice(typed.length)}</span>`;
      }

      function nextWord() {
        current = chooseWord();
        typed = "";
        inputEl.value = "";
        renderWord();
      }

      function popBubble() {
        bubbleEl.classList.add("pop");
        window.setTimeout(() => bubbleEl.classList.remove("pop"), 160);
      }

      function finishGame() {
        playing = false;
        window.clearInterval(timerId);
        timerId = null;
        inputEl.disabled = true;
        startEl.disabled = false;
        startEl.textContent = "もう一度";
        kanaEl.textContent = "終了";
        messageEl.textContent = "結果を確認して、もう一度挑戦できます。";
        const accuracy = keyCount === 0 ? 100 : Math.round(((keyCount - miss) / keyCount) * 100);
        resultEl.classList.add("show");
        resultEl.innerHTML = `
          <h2>結果</h2>
          <p>${cleared}個ポップ / スコア ${score} / 正確率 ${accuracy}%</p>
        `;
      }

      function startGame() {
        timeLeft = 45;
        score = 0;
        cleared = 0;
        miss = 0;
        keyCount = 0;
        playing = true;
        resultEl.classList.remove("show");
        inputEl.disabled = false;
        inputEl.focus();
        startEl.disabled = true;
        messageEl.textContent = "ミスを少なくして、たくさんポップさせましょう。";
        nextWord();
        renderStats();

        timerId = window.setInterval(() => {
          timeLeft -= 1;
          renderStats();
          if (timeLeft <= 0) {
            finishGame();
          }
        }, 1000);
      }

      inputEl.addEventListener("input", () => {
        if (!playing) return;

        keyCount += 1;
        const value = inputEl.value.toLowerCase();
        const target = current.roman;

        if (!target.startsWith(value)) {
          miss += 1;
          inputEl.value = typed;
          messageEl.textContent = "ミス。赤い文字の続きを入力してください。";
          renderStats();
          return;
        }

        typed = value;
        renderWord();

        if (typed === target) {
          cleared += 1;
          score += target.length * 12 + Math.max(timeLeft, 0) * 2;
          messageEl.textContent = `${current.word} をポップしました。`;
          popBubble();
          renderStats();
          nextWord();
        }
      });

      startEl.addEventListener("click", startGame);
      renderWord();
      renderStats();
    </script>
  </body>
</html>
