<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ゲーム一覧</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.12), transparent 34%),
          linear-gradient(315deg, rgba(22, 163, 74, 0.12), transparent 30%),
          #f8fbff;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .lead {
        margin: 0 0 24px;
        color: #64748b;
        line-height: 1.7;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        display: block;
        min-height: 120px;
        padding: 22px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #dbe5f0;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 42px rgba(30, 41, 59, 0.1);
      }

      .card:hover {
        border-color: #2563eb;
      }

      strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1.2rem;
      }

      span {
        display: block;
        color: #64748b;
        line-height: 1.7;
      }

      .play {
        display: inline-grid;
        place-items: center;
        min-height: 38px;
        margin-top: 18px;
        padding: 0 14px;
        color: #ffffff;
        background: #2563eb;
        border-radius: 8px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
      }

      .play:hover {
        background: #1d4ed8;
      }

      .other {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #dbe5f0;
      }

      .other a {
        color: #2563eb;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        main {
          padding: 24px 0;
        }

        .links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ゲーム一覧</h1>
      <p class="lead">遊びたいゲームをクリックすると、そのままゲーム画面に移動します。</p>
      <div class="links">
        <div class="card">
          <strong>POPタイピング</strong>
          <span>制限時間内に単語を入力してスコアを伸ばすゲームです。</span>
          <a class="play" href="pop-typing.html">プレイする</a>
        </div>
        <div class="card">
          <strong>テトリス</strong>
          <span>ブロックを回転させてラインをそろえるゲームです。</span>
          <a class="play" href="tetris.html">プレイする</a>
        </div>
        <div class="card">
          <strong>ブロックワールド</strong>
          <span>ブロックを置いたり壊したりして世界を作るゲームです。</span>
          <a class="play" href="block-world.html">プレイする</a>
        </div>
        <div class="card">
          <strong>ブロックブラスト風パズル</strong>
          <span>ブロックを盤面に置いて、行や列をそろえて消すパズルです。</span>
          <a class="play" href="block-blast.html">プレイする</a>
        </div>
        <div class="card">
          <strong>スロットゲーム</strong>
          <span>ゲーム内マネーで回せるスロットと救済タイミングゲームです。</span>
          <a class="play" href="slot-game.html">プレイする</a>
        </div>
      </div>
      <div class="other">
        <a href="profile.html">自己紹介ページを見る</a>
      </div>
    </main>
  </body>
</html>
