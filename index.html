<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページ一覧</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f8fbff;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 36px;
        background: #ffffff;
        border: 1px solid #dbe5f0;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(30, 41, 59, 0.12);
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      a {
        display: block;
        min-height: 120px;
        padding: 22px;
        color: inherit;
        text-decoration: none;
        border: 1px solid #dbe5f0;
        border-radius: 8px;
        background: #fbfdff;
      }

      a:hover {
        border-color: #2563eb;
      }

      strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1.2rem;
      }

      span {
        color: #64748b;
        line-height: 1.7;
      }

      @media (max-width: 640px) {
        main {
          padding: 24px;
        }

        .links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ページ一覧</h1>
      <div class="links">
        <a href="profile.html">
          <strong>自己紹介ページ</strong>
          <span>プロフィール、好きなこと、できることをまとめたページです。</span>
        </a>
        <a href="pop-typing.html">
          <strong>POPタイピング</strong>
          <span>制限時間内に単語を入力してスコアを伸ばすゲームです。</span>
        </a>
      </div>
    </main>
  </body>
</html>
