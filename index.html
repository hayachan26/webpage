<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ed;
        --text: #242424;
        --muted: #66615b;
        --accent: #1f7a6d;
        --accent-dark: #14584f;
        --card: #ffffff;
        --line: #ded8cf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .profile {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 32px;
        align-items: center;
        padding: 36px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 45px rgba(43, 36, 28, 0.08);
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 160px;
        aspect-ratio: 1;
        border-radius: 50%;
        color: #ffffff;
        font-size: 56px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #e0a33a);
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 6vw, 3.6rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      .role {
        margin-bottom: 24px;
        color: var(--accent-dark);
        font-size: 1.05rem;
        font-weight: 700;
      }

      .intro {
        margin-bottom: 0;
        color: var(--muted);
      }

      .sections {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      section {
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      h2 {
        margin-bottom: 12px;
        font-size: 1.1rem;
      }

      ul {
        padding-left: 1.2rem;
        margin: 0;
        color: var(--muted);
      }

      a {
        color: var(--accent-dark);
        font-weight: 700;
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 24px, 920px);
          padding: 28px 0;
        }

        .profile {
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 24px;
        }

        .avatar {
          width: 120px;
          font-size: 42px;
        }

        .sections {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="profile">
        <div class="avatar" aria-label="プロフィール画像の代替表示">名</div>
        <div>
          <h1>山田 太郎</h1>
          <p class="role">Web制作を学んでいる学生</p>
          <p class="intro">
            こんにちは。HTMLとCSSを使って、見やすく使いやすいWebページを作ることに取り組んでいます。
            新しい技術を試しながら、少しずつできることを増やしています。
          </p>
        </div>
      </article>

      <div class="sections">
        <section>
          <h2>好きなこと</h2>
          <ul>
            <li>Webデザイン</li>
            <li>写真を撮ること</li>
            <li>カフェ巡り</li>
          </ul>
        </section>

        <section>
          <h2>できること</h2>
          <ul>
            <li>HTMLでページ構造を作る</li>
            <li>CSSで見た目を整える</li>
            <li>スマートフォン対応のレイアウトを作る</li>
          </ul>
        </section>

        <section>
          <h2>目標</h2>
          <p>
            見た人に内容が伝わりやすく、気持ちよく読めるWebサイトを作れるようになることです。
          </p>
        </section>

        <section>
          <h2>連絡先</h2>
          <p>
            メール:
            <a href="mailto:example@example.com">example@example.com</a>
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
